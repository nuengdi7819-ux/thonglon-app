<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8"><title>เข้าสู่ระบบ - ทองล้น.com</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>body { background-color: #f4f6f9; display: flex; align-items: center; justify-content: center; height: 100vh; }</style>
</head>
<body>
    <div class="card p-4 shadow-sm border-0" style="width: 380px;">
        <div class="text-center mb-4">
            <h3><i class="fa-solid fa-coins text-warning"></i> ทองล้น.com</h3>
            <p class="text-muted">กรุณาเข้าสู่ระบบเพื่อจัดการข้อมูล</p>
        </div>
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert alert-{{ category }} py-2">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}
        <form method="POST">
            <div class="mb-3">
                <label class="form-label">ชื่อผู้ใช้งาน (Username):</label>
                <input type="text" name="username" class="form-control" required placeholder="admin">
            </div>
            <div class="mb-3">
                <label class="form-label">รหัสผ่าน (Password):</label>
                <input type="password" name="password" class="form-control" required placeholder="1234">
            </div>
            <button type="submit" class="btn btn-warning w-100 fw-bold">เข้าสู่ระบบ</button>
        </form>
    </div>
</body>
</html>
